[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scifig"
description = "Style, mm layout, recurring elements and export for Nature-style research figures with editable text."
readme = "README.md"
license = "MIT"
authors = [ { name = "quadbio" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [ "matplotlib>=3.8" ]
optional-dependencies.examples = [ "anndata", "pyyaml", "scanpy>=1.10" ]
optional-dependencies.spatial-examples = [
  "cellcharter>=0.3.7",
  "geopandas",
  "lightning",
  "scifig[examples]",
  "shapely>=2",
  "sopa>=2.2",
  "spatialdata>=0.8",
  "spatialdata-plot>=0.4.2",
  "squidpy>=1.8",
  "torch",
]
urls.Source = "https://github.com/quadbio/sci-figures"

[dependency-groups]
dev = [ "pre-commit", "pytest" ]

[tool.hatch]
version.path = ".claude-plugin/plugin.json"
version.pattern = '"version": "(?P<version>[^"]+)"'
build.targets.wheel.packages = [ "src/scifig" ]

[tool.ruff]
line-length = 120
src = [ "skills/sci-figures/examples", "src", "tests" ]
lint.select = [ "B", "C4", "D", "E", "F", "I", "UP" ]
lint.ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D401", # docstrings may open with a noun phrase
]
lint.per-file-ignores."skills/*" = [ "D" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib" ]
